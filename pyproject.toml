[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Accurate, cited answers over large document collections — with the evaluation to prove it."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "ai-core @ git+https://github.com/ashutoshbehera/ai-core.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
