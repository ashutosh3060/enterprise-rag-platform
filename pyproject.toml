[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Accurate, cited answers over large document collections — with the evaluation to prove it."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    # These four pins are load-bearing on x86 macOS: PyTorch stopped publishing
    # Intel Mac wheels after 2.2.2, and current `transformers` calls torch APIs
    # that do not exist there. Unpinned installs fail with a misleading
    # `NameError: name 'torch' is not defined`. On arm64/Linux you may relax them.
    "torch==2.2.2",
    "transformers==4.40.2",
    "sentence-transformers==2.7.0",
    "numpy<2",
    "ai-core @ git+https://github.com/ashutosh3060/ai-core.git@v0.2.0",
]

[project.scripts]
rag = "rag_platform.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Required for the `ai-core @ git+...` dependency: hatchling rejects direct
# URL references unless explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
